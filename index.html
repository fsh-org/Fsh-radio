<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Fsh radio</title>
    <!-- Boiler plate------ -->
    <link rel="icon" href="https://fsh.plus/fsh.png" type="image/png">
    <meta name="description" content="Fsh radio, listen to songs with people all around the world.">
    <!-- ------- -->
    <link rel="stylesheet" href="https://fsh.plus/media/style.css">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:image" content="https://fsh.plus/fsh.png"/>
    <meta name="theme-color" content="#a89c9b">
    <!-- ------------------ -->
    <script src="https://account.fsh.plus/script.js"></script>
    <link rel="stylesheet" href="/media/style.css">
    <link rel="manifest" href="/manifest.json">
  </head>
  <body>
    <a href="https://fsh.plus">
      <table class="title">
        <tr>
          <td><video src="https://fsh.plus/fsh.webm" playsinline autoplay muted loop width="100" alt="Spining low quality fish"></video></td>
          <td><h1>Fsh</h1></td>
        </tr>
      </table>
    </a>
    <h2 style="margin-top:-20px">Radio</h2>
    <br>
    <h2>Player <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 256 256" style="margin-bottom:-3px"><path d="M60 51.4762C60 49.1688 61.579 47.161 63.8213 46.6171L249.821 1.49877C252.968 0.735362 256 3.11945 256 6.35787V186H226V61.601C226 58.3949 223.025 56.0173 219.898 56.7239L93.898 85.194C91.6186 85.7091 90 87.7342 90 90.0711V221H60V51.4762Z"/><ellipse cx="45" cy="221" rx="45" ry="35"/><ellipse cx="211" cy="186" rx="45" ry="35"/></svg></h2>
    <div class="player">
      <img id="track-cover" width="80" height="80" alt="Cover image of track" src="https://fsh.plus/fsh.png">
      <span>
        <span id="track-title">Loading...</span>
        <span id="track-author">By: Loading...</span>
        <span class="controls">
          <button aria-label="Play/Pause radio" onclick="changePlayStatus()"><svg id="play-svg" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 256 256"><path d="M29 26.263C29 14.6537 41.6216 7.44498 51.6209 13.3432L224.097 115.08C233.936 120.884 233.936 135.116 224.097 140.92L51.6209 242.657C41.6216 248.555 29 241.346 29 229.737V26.263Z"/></svg></button>
          <input aria-label="Radio volume" type="range" max="100" min="0" value="100" onchange="volumeUpdate()" oninput="volumeUpdate()" id="volume-in">
          <label id="volume-out" for="volume-in">100</label>
        </span>
      </span>
    </div>
    <audio id="audio-player" style="display:none" src="https://stream.zeno.fm/f7qzuwipf1gvv"></audio>
    <script src="/media/script.js"></script>
    <br><br>
    <span>
      <a href="https://zeno.fm/radio/fsh-fm" target="_blank"><button>Zeno</button></a>
      <a href="https://stream.zeno.fm/f7qzuwipf1gvv"><button>Direct stream</button></a>
    </span>
    <p class="contact">For suggestions / takedowns contact radio@fsh.plus</p>
  </body>
</html>
